<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme");
      const theme = savedTheme ? savedTheme : "dark";
      document.documentElement.classList.toggle("dark-mode", theme === "dark");
    })();
  </script>

  <title>{% block title %}Analytics With Avery{% endblock %}</title>

  <meta name="description" content="{% block meta_description %}Analytics With Avery{% endblock %}">
  <meta name="keywords" content="{% block meta_keywords %}Analytics With Avery{% endblock %}">
  <meta name="author" content="Avery Doiron">

  <meta property="og:site_name" content="Analytics With Avery">
  <meta property="og:title" content="{% block og_title %}Analytics With Avery{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Analytics With Avery{% endblock %}">
  <meta property="og:image" content="{% block og_image %}https://analyticswithavery.com/static/assets/analytics_with_avery_logos/analyticswithavery_logo.png{% endblock %}">
  <meta property="og:url" content="{% block og_url %}https://analyticswithavery.com/{% endblock %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  {% block article_meta %}{% endblock %}

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@analyticswavery">
  <meta name="twitter:creator" content="@analyticswavery">
  <meta name="twitter:title" content="{% block twitter_title %}Analytics With Avery{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Analytics With Avery{% endblock %}">
  <meta name="twitter:image" content="{% block twitter_image %}https://analyticswithavery.com/static/assets/analytics_with_avery_logos/analyticswithavery_logo.png{% endblock %}">

  <link rel="canonical" href="{{ request.base_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "name": "Avery Doiron",
        "alternateName": "Analytics With Avery",
        "url": "https://analyticswithavery.com/",
        "image": "https://analyticswithavery.com/static/assets/analytics_with_avery_logos/profile_picture.jpg",
        "email": "mailto:averyjdoiron@icloud.com",
        "jobTitle": "Computer Science Student & Sports Analytics Researcher",
        "description": "Computer science student at St. Francis Xavier University specializing in data science and sports analytics, and creator of Analytics With Avery.",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "St. Francis Xavier University",
          "url": "https://www.stfx.ca"
        },
        "sameAs": [
          "https://www.linkedin.com/in/averydoiron/",
          "https://github.com/AveryJD",
          "https://x.com/analyticswavery",
          "https://www.instagram.com/analyticswavery/",
          "https://www.instagram.com/averyjdoiron/",
          "https://www.youtube.com/@analyticswavery",
          "https://www.tiktok.com/@analyticswavery",
          "https://www.reddit.com/user/analyticswavery/",
          "https://www.teamworkonline.com/business_cards/45e1b20c5ee12e26"
        ]
      },
      {
        "@type": "WebSite",
        "name": "Analytics With Avery",
        "url": "https://analyticswithavery.com/",
        "author": {
          "@type": "Person",
          "name": "Avery Doiron"
        }
      }
    ]
  }
  </script>

  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-xxPCK6Au878YurMoYotCg.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='assets/analytics_with_avery_logos/favicon.png') }}" type="image/png">

  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='assets/analytics_with_avery_logos/icon-180x180.png') }}">
  <link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='assets/analytics_with_avery_logos/icon-152x152.png') }}">
  <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='assets/analytics_with_avery_logos/icon-120x120.png') }}">

  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='assets/analytics_with_avery_logos/icon-192x192.png') }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='assets/analytics_with_avery_logos/icon-512x512.png') }}">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Analytics With Avery">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  {% block extra_head %}{% endblock %}
</head>

<body>
  {% include "components/nav.html" %}

  <div class="page-content">
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  {% include "components/footer.html" %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
